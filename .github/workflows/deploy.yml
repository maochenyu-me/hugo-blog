name: Deploy Hugo Blog to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.166.0"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout blog with theme submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Hugo extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site and pagefind index
        env:
          # 注意：这里不能直接把 vars.BASE_URL 赋给 HUGO_BASEURL。
          # 变量未配置时 Hugo 会收到空字符串并覆盖 hugo.toml 的 baseURL，
          # 导致 canonical/og:url/sitemap 变成相对路径。
          BASE_URL_VAR: ${{ vars.BASE_URL }}
        run: |
          if [ -n "${BASE_URL_VAR:-}" ]; then
            echo "使用 BASE_URL 变量：$BASE_URL_VAR"
            export HUGO_BASEURL="$BASE_URL_VAR"
          else
            echo "BASE_URL 变量未配置，回退到 hugo.toml 的 baseURL"
          fi
          node tools/build.mjs --prod

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_NAME:-}" ]; then
            echo "::error::变量 CLOUDFLARE_PROJECT_NAME 未配置（Settings → Secrets and variables → Actions → Variables）"
            exit 1
          fi
          echo "目标 Pages 项目：$PROJECT_NAME"
          echo "── 当前账号下已有的 Pages 项目 ──"
          npx --yes wrangler@4 pages project list || true
          echo "──────────────────────────────────"
          # 幂等：不存在才创建；已存在时 create 会报错，忽略即可（随后 deploy 会验证真伪）
          if npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main; then
            echo "✓ 已创建 Pages 项目：$PROJECT_NAME"
          else
            echo "ℹ 项目可能已存在（或创建被跳过），继续部署"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --commit-dirty=true