name: Friend Link Sync

# 三条直线，一个动作只跑一次工作流：
#
#   ① 收录：用户按「友链申请」模板提交议题（表单原生打上「友链申请」标签）
#      → 你关闭议题 → 机器人把字段转成 YAML 代码块贴在评论里 → 你自己复制进 data/links.yaml
#      触发：issues.closed
#
#   ② 下线：你给议题打上「失效」标签 → 移进「😭 失效暂留」并在条目上方写 `# 原位置：...`
#      触发：issues.labeled        —— 不需要再重开议题
#
#   ③ 恢复：你摘掉「失效」标签 → 从「失效暂留」迁回原位置
#      触发：issues.unlabeled      —— 不需要再关闭议题
#
# 因此监听事件只有 closed / labeled / unlabeled 三个，一个动作恰好对应一次运行。
# （旧版监听 opened/reopened，导致申请一次要跑 3 次工作流，还出现一次取消。）
#
# 注意：用 GITHUB_TOKEN 推送的 commit 不会再触发 deploy.yml 的 push 事件，
#      所以这里提交完成后显式用 workflow_dispatch 拉起部署。

on:
  issues:
    types: [closed, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: friend-link-sync
  cancel-in-progress: false

env:
  LINKS_FILE: data/links.yaml
  LINKPAGE_FILE: content/link.md
  LABEL_APPLY: 友链申请
  LABEL_DEAD: 失效

jobs:
  # 一次性引导：部署后到 Actions 手动 Run 一次本工作流，把两个受管标签建出来。
  # 标签存在后，Issue 表单就能在创建议题时原生打上「友链申请」，
  # 于是不需要监听 opened、也不需要在工作流里再加标签（那会额外触发一次 labeled 运行）。
  labels:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create managed labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create "$LABEL_APPLY" --color 0E8A16 --description "通过「友链申请」模板提交的议题" >/dev/null 2>&1 || true
          gh label create "$LABEL_DEAD"  --color B60205 --description "站点失效，工作流会把它移入失效暂留分组" >/dev/null 2>&1 || true
          echo "已确保标签存在：$LABEL_APPLY / $LABEL_DEAD"

  sync:
    if: github.event_name != 'workflow_dispatch' && (
      startsWith(github.event.issue.title, '[友链申请]') ||
      contains(github.event.issue.labels.*.name, '友链申请') ||
      contains(github.event.issue.labels.*.name, '失效') ||
      contains(github.event.issue.body, '### 站点地址'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect issue context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          TMP_DIR="$RUNNER_TEMP/friend-link"
          mkdir -p "$TMP_DIR"
          echo "TMP_DIR=$TMP_DIR" >> "$GITHUB_ENV"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$TMP_DIR/issue.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > "$TMP_DIR/comments.json"
          echo "已抓取议题 #${ISSUE_NUMBER} 及其评论"

      - name: Apply friend link change
        id: apply
        run: |
          set -euo pipefail
          node tools/friend-link.mjs handle \
            --root . \
            --issue "$TMP_DIR/issue.json" \
            --comments "$TMP_DIR/comments.json" \
            --result "$TMP_DIR/result.json" \
            --commentfile "$TMP_DIR/comment.md"

      - name: Commit and push
        if: steps.apply.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.apply.outputs.summary }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LINKS_FILE" "$LINKPAGE_FILE"
          if git diff --cached --quiet; then
            echo "没有实际改动，跳过提交。"
            exit 0
          fi
          git commit -m "chore(friend-link): #${ISSUE_NUMBER} ${SUMMARY}"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Trigger Cloudflare deploy
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo "已请求重新部署"

      - name: Reply on issue
        if: steps.apply.outputs.has_comment == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          jq -Rs '{body: .}' "$TMP_DIR/comment.md" > "$TMP_DIR/comment.json"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --input "$TMP_DIR/comment.json"
          echo "已回复议题 #${ISSUE_NUMBER}"
