- h3: 内容定位
  id: 内容定位
- ul:
  - 技术分享：前端开发、后端服务、ai编程
  - 建站记录：博客魔改、日常记录、资源分享、服务部署
  - 个人内容：学习笔记、生活随笔、阶段性思考
- p: 本站会继续围绕“稳定、可维护、阶段性记录”来继续维护博客，尽量维持稳定的更新时间。
