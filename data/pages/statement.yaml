blocks:
- h3: 更新日期
  id: 更新日期
- p: 本协议的最近更新日期为：2024-09-08。
- p: 本站非常重视用户的隐私和个人信息保护。你在使用 <code>blog.liushen.fun</code> 网站时，可能会收集和使用你的相关信息。通过本《隐私政策》向你说明如何收集、使用、保存、共享和转让这些信息，并阐明你的相关权利。
- h3: 一、内容规范与法律责任
  id: 一内容规范与法律责任
- p: 本站严肃声明，不涉及任何政治、国家主权、暴力、违法、恐怖主义、种族歧视、宗教极端主义或其他违反国家法律法规及国际公约的讨论或内容。我们承诺并要求用户在使用本站时，严格遵守以下规定：
- h4: 1. 政治与国家主权
  id: 1-政治与国家主权
- p: 本站严格禁止任何关于政治讨论、国家主权争议、政党宣传或政府批评等相关话题。任何用户如在评论或其他互动环节中发表涉及此类内容的言论，将被立即删除，且本站有权采取永久封禁措施，情节严重者，将配合执法机关进行进一步处理。
- h4: 2. 非法行为与暴力内容
  id: 2-非法行为与暴力内容
- p: 本站拒绝发布或讨论任何形式的违法行为、犯罪手段、暴力内容、煽动仇恨或破坏公共秩序的言论。用户不得在本站发布、传播或讨论任何与毒品、武器、恐怖主义、恐吓或暴力等非法行为相关的内容。如有发现相关违法内容，本站会第一时间采取删除措施，并向相关部门报告。
- h4: 3. 歧视性和极端言论
  id: 3-歧视性和极端言论
- p: 本站不允许任何形式的种族、性别、宗教、民族、文化歧视或仇恨言论。禁止在本站散布任何极端主义思想或宣扬不平等的内容，任何违反此规定的用户将被永久封禁，且可能会被提交给相关司法机关处理。
- h4: 4. 淫秽、色情与非法交易
  id: 4-淫秽色情与非法交易
- p: 禁止在本站发布任何与淫秽、色情、低俗内容相关的文章、评论、图片或链接。用户不得使用本站进行任何形式的非法交易、欺诈行为或发布涉及非法商品（如假冒伪劣产品、盗版软件、违禁物品等）的广告。如有违反，本站将立即采取法律行动。
- h4: 5. 版权与知识产权保护
  id: 5-版权与知识产权保护
- p: 本站尊重他人版权和知识产权，禁止发布未经授权的转载、抄袭、侵权内容。任何侵犯他人知识产权的行为，将会被本站删除并采取相应的法律措施。若用户发现本站有侵犯其权益的内容，可随时联系我们进行处理。
- h4: 6. 用户责任
  id: 6-用户责任
- p: 用户应对自己在本站的言论和行为负责，任何不符合法律、社会道德或本协议的行为，可能导致用户承担法律责任。本站保留在不通知用户的情况下随时修改、删除任何违反规定的内容或限制用户访问的权利。
- h4: 7. 法律适用
  id: 7-法律适用
- p: 本站遵循中华人民共和国法律及相关国际法律，任何在本站进行的违法行为都将受到相应法律的制裁。用户在使用本站服务时，需了解并遵守相关法律法规，避免触犯国家或国际法律。
- p: <strong>本站对所有用户行为进行实时监控，并设有严格的审查机制，一经发现违规行为，本站将立即采取相应措施，包括但不限于永久封禁用户、删除不当内容及配合司法机关进行相关调查。请用户自觉遵守规定，共同维护健康、和谐的网络环境。</strong>
- p: <strong>以上为本站最为重要的使用规范，请所有用户严格遵守，以避免不必要的法律风险。</strong>
- h3: 二、个人信息的收集与使用
  id: 二个人信息的收集与使用
- h4: 1. 访问网站时自动收集的信息
  id: 1-访问网站时自动收集的信息
- p: 在你访问 <code>blog.liushen.fun</code> 网站时，本站可能会自动收集以下信息：
- ul:
  - <strong>网络身份标识信息</strong>：包括你的浏览器 User Agent、IP 地址等；
  - <strong>设备信息</strong>：设备型号、操作系统、分辨率、设备设置等；
  - <strong>浏览信息</strong>：包括访问的页面、点击行为、访问时长、操作路径等；
  - <strong>网络性能与加载情况</strong>：加载时间、网络延迟、站点响应速度等。
- p: 这些信息的收集主要用于网站优化、提供更好的用户体验、识别异常访问行为及分析站点性能。
- h4: 2. 第三方服务收集的信息
  id: 2-第三方服务收集的信息
- p: 本站使用了以下第三方服务，这些服务可能会收集相关信息：
- ul:
  - <strong>UMAMI 统计（作者自建）</strong>：用于记录用户的访问信息、操作过程；
  - <strong>腾讯云 CDN</strong>、<strong>LiuShen CDN（作者自建）</strong>：收集访问设备、操作系统、浏览器版本信息及页面加载情况；
  - <strong>不蒜子统计（作者自建）</strong>：用于记录访客的浏览量与站点流量；
  - <strong>Bilibili</strong>、<strong>网易云音乐</strong>：如果你播放嵌入的音乐或视频，相关平台可能会收集相应的浏览和播放数据。
- h4: 3. 信息的使用目的
  id: 3-信息的使用目的
- p: 收集的信息将主要用于以下目的：
- ul:
  - <strong>提升用户体验</strong>：根据你的设备和浏览习惯，优化页面的显示效果、加载速度；
  - <strong>安全保障</strong>：防止恶意访问、DDoS 攻击、SQL 注入等攻击行为；
  - <strong>站点性能分析</strong>：分析页面加载时间、网站响应速度、用户行为以改进站点性能；
  - <strong>用户行为分析</strong>：用于网站优化、文章推荐等功能的改善。
- h3: 三、评论信息的收集与使用
  id: 三评论信息的收集与使用
- p: 本站使用匿名评论系统，用户可以在评论时自愿提供信息。为了保护用户隐私，建议用户使用不易被识别的昵称。如果你选择填写邮箱，邮箱信息仅用于通知你收到的回复，不会对外公开。
- h4: 1. 评论时收集的信息
  id: 1-评论时收集的信息
- p: 当你进行评论时，本站可能会收集以下信息：
- ul:
  - <strong>QQ 头像</strong>：如果你使用 QQ 邮箱进行评论，系统会自动获取你的 QQ 头像用于显示；
  - <strong>邮箱地址</strong>：填写的邮箱地址仅用于通知回复内容，不会公开；
  - <strong>IP 地址</strong>：用于防止垃圾评论和恶意访问；
  - <strong>浏览器代理信息</strong>：用于分析评论设备及快速定位问题；
  - <strong>评论内容</strong>：你提交的所有评论内容将会公开展示在评论区。
- h4: 2. 评论内容的处理
  id: 2-评论内容的处理
- p: 本站保留删除恶意评论、广告、或违反网站使用规范评论的权利。对于涉嫌违法的评论内容，本站将积极配合执法机关处理。
- h3: 四、Cookies 和本地存储的使用
  id: 四cookies-和本地存储的使用
- p: 为了提供更加个性化的用户体验和支持无账号评论功能，本站使用了 <strong>Cookies</strong> 和 <strong>LocalStorage</strong> 技术。用户可以通过浏览器设置管理或清除这些数据，清除后不影响正常使用。
- h4: 1. Cookies 的使用目的
  id: 1-cookies-的使用目的
- p: Cookies 主要用于：
- ul:
  - <strong>无账号评论系统</strong>：记录用户的评论信息和历史；
  - <strong>深色模式切换</strong>：记录用户的颜色偏好设置；
  - <strong>不蒜子统计</strong>：记录访问量；
  - <strong>站点性能分析</strong>：用于监控网站访问数据。
- h4: 2. 本地存储的使用
  id: 2-本地存储的使用
- p: 本站使用 LocalStorage 来支持以下功能：
- ul:
  - <strong>评论系统</strong>：存储匿名评论的用户信息；
  - <strong>主题偏好</strong>：存储深色/浅色模式选择；
  - <strong>不蒜子统计</strong>：存储用户的访问信息，用于网站统计分析。
- h4: 3. Cookies 管理
  id: 3-cookies-管理
- p: 用户可以通过浏览器设置随时管理或删除 Cookies。如果你选择拒绝 Cookies，可能无法享受完整的功能体验。
- h3: 五、信息共享与转让
  id: 五信息共享与转让
- p: 本站不会与任何公司、组织或个人分享你的个人信息，除非符合以下情况：
- ul:
  - <strong>法律要求</strong>：在法律、法规、司法机关要求下，本站可能会提供相关信息；
  - <strong>第三方服务商</strong>：为实现网站功能或分析用户数据，本站会与第三方服务提供商共享必要信息，如统计工具和云服务提供商。
- p: 第三方服务商的隐私协议请参考对应的服务条款。
- h3: 六、信息安全保障
  id: 六信息安全保障
- p: 本站采用严格的安全措施保护你的个人信息，确保信息的安全性、保密性和完整性。我们采取合理的技术手段和管理措施防止数据泄露、篡改或丢失。
- h3: 七、附属协议
  id: 七附属协议
- p: 如果发现有恶意访问、攻击、恶意评论等行为，本站有权采取以下措施：
- ul:
  - 临时或永久将相关 IP 地址列入黑名单；
  - 共享这些 IP 地址及相关信息给其他站点或服务提供商。
- h3: 八、文章版权与转载规则
  id: 八文章版权与转载规则
